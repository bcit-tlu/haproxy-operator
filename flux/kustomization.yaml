# FluxCD Kustomization – syncs the haproxy.cfg from the GitRepository into
# a Kubernetes Secret that the operator watches.
#
# The config repo should contain a kustomization.yaml that generates the Secret:
#
#   apiVersion: kustomize.config.k8s.io/v1beta1
#   kind: Kustomization
#   secretGenerator:
#     - name: haproxy-config
#       namespace: haproxy-operator
#       files:
#         - haproxy.cfg
#       options:
#         disableNameSuffixHash: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haproxy-config
  namespace: haproxy-operator
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: haproxy-config
  path: ./  # path within the config repo
  prune: true
  targetNamespace: haproxy-operator
