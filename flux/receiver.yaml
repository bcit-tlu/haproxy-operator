# FluxCD Receiver – webhook endpoint that triggers immediate GitRepository
# reconciliation when a GitHub push event arrives.
#
# Setup:
# 1. Create a K8s Secret with the webhook shared secret:
#      kubectl -n haproxy-operator create secret generic webhook-token \
#        --from-literal=token=$(openssl rand -hex 32)
# 2. Apply this manifest.
# 3. Get the webhook URL:
#      kubectl -n haproxy-operator get receiver haproxy-config -o jsonpath='{.status.webhookPath}'
# 4. Add the URL as a GitHub webhook on the config repo (content type: JSON,
#    secret: the token from step 1, events: push).
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: haproxy-config
  namespace: haproxy-operator
spec:
  type: github
  events:
    - ping
    - push
  secretRef:
    name: webhook-token
  resources:
    - kind: GitRepository
      name: haproxy-config
