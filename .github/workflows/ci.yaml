name: "[CI] Test, build & publish"

# Readable run titles in the Actions UI: PR runs show the PR number and
# title; main pushes show the head commit subject.
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Head build — {0}', github.event.head_commit.message) }}

on:
  push:
    branches: [main]
  # Scope PR runs to PRs targeting `main` only; bare `pull_request:` fires
  # for PRs against any base branch, which isn't what this workflow is
  # meant to gate.
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least-privilege default: only read access at the workflow level.
# Jobs that need more elevate locally.
permissions:
  contents: read

jobs:
  # ── Quality gates ─────────────────────────────────────────
  #
  # Tests and vet run on every push + PR. helm-lint runs
  # independently (its failure breaks the workflow status but
  # does not block the image build).

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Vet
        run: go vet ./...

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Lint, template-render & validate all charts
        run: |
          for chart in charts/*/; do
            name=$(basename "$chart")
            echo "::group::${name}"
            helm lint "$chart"
            helm template test "$chart" \
              | kubeconform -strict -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                  -ignore-missing-schemas
            echo "::endgroup::"
          done

  # ── Container image ──────────────────────────────────────
  #
  # The shared reusable workflow handles checkout, change
  # detection, Docker build/push, Cosign signing, and Trivy
  # scanning.
  #
  # `helm-lint` is intentionally NOT in `needs` — it runs as an
  # independent parallel job whose failure surfaces via branch
  # protection (required status check) rather than delaying or
  # blocking image builds.

  build-haproxy-operator:
    needs: [go-test]
    uses: bcit-tlu/.github/.github/workflows/oci-build.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      actions: read            # Required by codeql-action/upload-sarif on private repos
    with:
      component: haproxy-operator
      image_name: haproxy-operator
      context: .
      tag_prefix: "v"
    secrets: inherit

  # ── Chart publish (rc) ─────────────────────────────────
  #
  # Packages charts/haproxy-operator at the image build's rc_version and
  # pushes it to oci://ghcr.io/<repo>/charts. The cluster03 `latest`
  # cluster-env patches app OCIRepositories to only resolve tags matching
  # `^.*-rc.*$`, so without this job no chart tag ever resolves there
  # (flux-fleet#314). Stable versions are still published by
  # helm-publish.yaml on release.

  helm-publish-rc:
    needs: [helm-lint, build-haproxy-operator]
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.helm-lint.result == 'success' &&
      needs.build-haproxy-operator.result == 'success' &&
      needs.build-haproxy-operator.outputs.changed == 'true' &&
      needs.build-haproxy-operator.outputs.rc_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - uses: sigstore/cosign-installer@v3

      - name: Cosign login (OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | \
            cosign login "${REGISTRY}" \
            -u "${ACTOR}" \
            --password-stdin

      - name: Helm login (OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | \
            helm registry login "${REGISTRY}" \
            -u "${ACTOR}" \
            --password-stdin

      - name: Package, push & sign chart
        shell: bash
        env:
          VERSION: ${{ needs.build-haproxy-operator.outputs.rc_version }}
          OCI_BASE: oci://${{ env.REGISTRY }}/${{ github.repository }}/charts
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ github.repository }}/charts
        run: |
          set -euo pipefail

          CHART_DIR="charts/haproxy-operator"
          CHART_NAME=$(yq '.name' "${CHART_DIR}/Chart.yaml")
          DEST_DIR="/tmp/charts"
          mkdir -p "${DEST_DIR}"

          echo "::group::${CHART_NAME} ${VERSION}"

          helm dependency update "${CHART_DIR}" || true

          helm package "${CHART_DIR}" \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            -d "${DEST_DIR}"

          PUSH_OUT=$(helm push \
            "${DEST_DIR}/${CHART_NAME}-${VERSION}.tgz" \
            "${OCI_BASE}" 2>&1) || { echo "${PUSH_OUT}"; exit 1; }
          echo "${PUSH_OUT}"

          # Tolerant digest parse: case-insensitive, allows leading whitespace.
          DIGEST=$(printf '%s\n' "${PUSH_OUT}" \
            | awk 'tolower($1)=="digest:"{print $2; exit}')
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::helm push for ${CHART_NAME} succeeded but no digest found in output"
            exit 1
          fi

          cosign sign --yes "${IMAGE_BASE}/${CHART_NAME}@${DIGEST}"

          echo "::endgroup::"
