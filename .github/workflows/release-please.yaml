name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # `actions: write` is required for the dispatch-publish job below to
  # call `gh workflow run` on ci.yaml. GitHub explicitly forbids workflow
  # runs created by tag pushes that are themselves made by GITHUB_TOKEN
  # — so the `on: push: tags:` trigger in ci.yaml never fires for
  # release-please tags. `workflow_dispatch`, however, IS allowed from
  # GITHUB_TOKEN, so we re-dispatch ci.yaml explicitly against each
  # just-created tag ref.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Re-dispatch ci.yaml for each freshly-created tag ──────────
  #
  # release-please runs under the default GITHUB_TOKEN, so the tag it
  # creates (e.g. v0.2.0-rc) does NOT auto-trigger ci.yaml's
  # `on: push: tags:` listener — GitHub suppresses workflow chaining
  # from GITHUB_TOKEN-created refs to prevent infinite recursion.
  # Without this job, rc / stable tags never produce OCI image or
  # chart artifacts; only the moving `head` pushed on main-branch
  # commits ever reaches GHCR.
  #
  # `gh workflow run --ref <tag>` IS allowed from GITHUB_TOKEN because
  # workflow_dispatch has an explicit audit trail and isn't prone to
  # the same recursion class. The dispatched run sees
  # github.ref=refs/tags/<tag> and github.event_name=workflow_dispatch,
  # which ci.yaml's `versions` job handles identically to a `push` tag
  # event (the tag-ref check runs before the event-name branches).
  dispatch-publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags needed for the highest-stable computation
          # in the "Promote graduated release" step below.
          fetch-depth: 0

      - name: Ensure ci.yaml has a workflow_dispatch trigger
        run: |
          if ! grep -q 'workflow_dispatch' .github/workflows/ci.yaml; then
            echo "::error::.github/workflows/ci.yaml must declare 'workflow_dispatch' for this job to dispatch it" >&2
            exit 1
          fi

      - name: Dispatch ci.yaml on the just-created tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ -z "${TAG}" ]]; then
            echo "::warning::release-please reported a release but no tag_name output; skipping dispatch"
            exit 0
          fi
          echo "Dispatching ci.yaml on tag ref: ${TAG}"
          gh workflow run ci.yaml --ref "${TAG}"

      # ── Promote graduated releases from Pre-release → Latest ────
      #
      # release-please-config.json sets repo-level `"prerelease": true`,
      # which makes release-please mark EVERY GitHub release it creates
      # (rc AND graduated full-release) with prerelease=true. That is
      # correct for rc tags (vX.Y.Z-rcN) but wrong for graduated stable
      # tags (vX.Y.Z), which should appear as full releases in the
      # GitHub UI and — iff this is the highest stable semver — as
      # "Latest release".
      #
      # We fix this after the fact: whenever the just-created tag has
      # no prerelease suffix (no `-` in the version), flip the GitHub
      # release's `prerelease` flag to false and, iff this is the
      # highest stable semver, set it as the repo's "Latest release".
      # This mirrors the OCI-publish logic in ci.yaml's `versions` job
      # exactly (same tag glob, same `-`-filter, same `sort -V | tail`),
      # so the GitHub release's "Latest" flag tracks the image/chart
      # `:latest` pointer.
      - name: Promote graduated release to full release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ -z "${TAG}" ]]; then
            echo "::warning::release-please reported a release but no tag_name output; skipping promote"
            exit 0
          fi
          VERSION="${TAG#v}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "Tag ${TAG} is a prerelease (contains '-'); leaving GitHub release flags as-is."
            exit 0
          fi

          HIGHEST_STABLE=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" \
            | grep -v -- '-' \
            | sed "s/^v//" \
            | sort -V \
            | tail -n1)

          if [[ "${VERSION}" == "${HIGHEST_STABLE}" ]]; then
            echo "Promoting ${TAG}: prerelease=false, latest=true (highest stable)."
            gh release edit "${TAG}" --prerelease=false --latest=true
          else
            echo "Promoting ${TAG}: prerelease=false, latest=false (backport below highest stable ${HIGHEST_STABLE})."
            gh release edit "${TAG}" --prerelease=false --latest=false
          fi
