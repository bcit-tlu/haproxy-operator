version: 2

# Weekly grouped bumps keep release-please fed with one PR per ecosystem
# instead of a stream of per-dependency noise. Major bumps stay ungrouped so
# each gets its own review (they are the ones that break APIs).
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # k8s.io/api is bumped by MVS whenever client-go moves (client-go pins
    # the matching api minor). Updated on its own, the newer api drops
    # packages the current client-go still imports, so `go mod tidy` fails
    # and every weekly run reports dependency_file_not_resolvable.
    ignore:
      - dependency-name: k8s.io/api
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]
