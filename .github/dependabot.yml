version: 2

# Weekly grouped bumps keep release-please fed with one PR per ecosystem
# instead of a stream of per-dependency noise. Major bumps stay ungrouped so
# each gets its own review (they are the ones that break APIs).
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # k8s.io/api is bumped by MVS whenever client-go moves (client-go pins
      # the matching api minor). Updated on its own, the newer api drops
      # packages the current client-go still imports, so `go mod tidy` fails
      # and every weekly run reports dependency_file_not_resolvable.
      - dependency-name: k8s.io/api
      # The fleet stays on Kubernetes 1.35 (RKE2 v1.35, ingress-nginx), so
      # hold the client libraries to that minor; patch releases still flow.
      # controller-runtime v0.23 is the line built against k8s.io v0.35.
      - dependency-name: k8s.io/*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: sigs.k8s.io/controller-runtime
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]
