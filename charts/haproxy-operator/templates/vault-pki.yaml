{{- if .Values.vault.enabled }}
# VSO VaultPKISecret — issues and rotates the operator's mTLS client
# certificate from the Vault pki-haproxy intermediate (bcit-tlu/vault#67).
# Destination keys are pinned to ca.crt / tls.crt / tls.key — the exact
# contract dataplane.caCertPath/clientCertPath/clientKeyPath expects.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultPKISecret
metadata:
  name: {{ include "haproxy-operator.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haproxy-operator.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ .Values.vault.authRef }}
  mount: {{ .Values.vault.pki.mount }}
  role: {{ .Values.vault.pki.role }}
  commonName: {{ .Values.vault.pki.commonName }}
  ttl: {{ .Values.vault.pki.ttl }}
  destination:
    name: {{ .Values.vault.pki.secretName }}
    create: true
    transformation:
      templates:
        ca.crt:
          text: {{ `{{- get .Secrets "ca_chain" -}}` | quote }}
        tls.crt:
          text: {{ `{{- get .Secrets "certificate" -}}` | quote }}
        tls.key:
          text: {{ `{{- get .Secrets "private_key" -}}` | quote }}
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "haproxy-operator.fullname" . }}
{{- end }}
