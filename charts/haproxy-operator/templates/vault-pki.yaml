{{- if and .Values.vault.enabled .Values.vault.pki.mount }}
# VSO VaultPKISecret – automatically issues and rotates TLS certificates
# from the Vault PKI Secondary Intermediate CA (pki-sica-v2).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultPKISecret
metadata:
  name: {{ include "haproxy-operator.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haproxy-operator.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ .Values.vault.authRef }}
  mount: {{ .Values.vault.pki.mount }}
  role: {{ .Values.vault.pki.role }}
  commonName: {{ .Values.vault.pki.commonName }}
  ttl: {{ .Values.vault.pki.ttl }}
  destination:
    name: {{ .Values.vault.pki.secretName }}
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "haproxy-operator.fullname" . }}
{{- end }}
