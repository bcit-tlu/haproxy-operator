{{- if not .Values.rbac.namespaced }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "haproxy-operator.fullname" . }}
  labels:
    {{- include "haproxy-operator.labels" . | nindent 4 }}
rules:
  # Read-only on Secrets cluster-wide — TLS Secrets are VSO-owned and must
  # never be written (bcit-tlu/haproxy-operator#43).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Write (status/cert-sync annotations) is confined to the config Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.secretName }}"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
