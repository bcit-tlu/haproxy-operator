{{- if .Values.rbac.namespaced }}
# Workload Role lives in the WATCHED namespace (default: release namespace) —
# a Role only grants in its own namespace, and the operator's Secret cache is
# scoped to watchNamespace, so placing this in the release namespace would
# break watches whenever the two differ.
{{- $watchNS := .Values.watchNamespace | default .Release.Namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "haproxy-operator.fullname" . }}
  namespace: {{ $watchNS }}
  labels:
    {{- include "haproxy-operator.labels" . | nindent 4 }}
rules:
  # Read-only on every Secret in the watch namespace — TLS Secrets are
  # VSO-owned and must never be written (bcit-tlu/haproxy-operator#43).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Write (status/cert-sync annotations) is confined to the config Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.secretName }}"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
# Leader-election Role stays in the release namespace, where the manager's
# lease is created.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "haproxy-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haproxy-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
