# Default values for haproxy-operator.

replicaCount: 1

image:
  repository: ghcr.io/bcit-tlu/haproxy-operator/haproxy-operator
  pullPolicy: IfNotPresent
  tag: "" # Overridden by appVersion

serviceAccount:
  create: true
  name: haproxy-operator

# Namespace the operator watches for the haproxy-config Secret.
watchNamespace: haproxy-operator

# Name of the K8s Secret containing haproxy.cfg (synced by Flux).
secretName: haproxy-config
secretKey: haproxy.cfg

# TLS Secrets in watchNamespace pushed to the gateway's Dataplane
# ssl_certificates storage as <name>.pem before config validation — a
# haproxy.cfg may then reference them via `crt <ssl_certs_dir>/<name>.pem`.
# Rotation propagates automatically on the next VSO refresh.
certsSecretNames: []

# Controller behaviour.
controller:
  # Re-apply the desired config when the periodic (5m) requeue finds the
  # gateway's live config has drifted out-of-band. Drift is always detected
  # and reported (haproxy_operator_config_in_sync + a ConfigDrift Event);
  # false turns remediation off — alert-only mode.
  driftRemediate: true

# HAProxy Dataplane API connection.
dataplane:
  url: "https://haproxy:5555/v3"
  # Disables server verification on the Dataplane TLS connection — exists
  # ONLY for local kind/dev runs. The chart refuses to render it together
  # with vault.enabled or spire.enabled, and the operator exports
  # haproxy_operator_dataplane_insecure=1 while it is set.
  insecure: false
  # Paths inside the pod where static TLS certs are mounted (used when SPIRE is disabled).
  # caCertPath is the SERVER trust anchor — it lives on its own volume so the
  # client-cert Secret and the server CA can come from different issuers
  # (bcit-tlu/haproxy-operator#39, prereq for bcit-tlu/vault#69).
  caCertPath: /etc/haproxy-operator/server-ca/ca.crt
  clientCertPath: /etc/haproxy-operator/tls/tls.crt
  clientKeyPath: /etc/haproxy-operator/tls/tls.key
  # Server-CA trust source — exactly one of vaultPKI / configMap /
  # secretKeyRef (the chart fails otherwise). Unset → implicit default:
  # vaultPKI when vault.enabled (rendered from the PKI mount's cert/ca, a
  # different object than the client-cert VaultPKISecret), else
  # secretKeyRef pointing at dataplane.tls.existingSecret's ca.crt — the
  # historical single-source behavior for static installs.
  serverCA:
    # Rendered VaultDynamicSecret reading <mount>/cert/ca — the issuing
    # intermediate PEM, readable by the operator's existing client policy.
    # Requires vault.enabled; ignored under spire.enabled.
    vaultPKI:
      enabled: false
      # defaults to vault.pki.mount
      mount: ""
      path: cert/ca
      # destination Secret holding ca.crt; defaults to <fullname>-server-ca
      secretName: ""
      refreshAfter: 1h
    configMap:
      name: ""
      key: ca.crt
    secretKeyRef:
      name: ""
      key: ca.crt
  tls:
    # Existing Secret holding ca.crt/tls.crt/tls.key. Ignored when
    # vault.enabled (the VaultPKISecret destination name wins) or
    # spire.enabled (Workload API supplies credentials).
    existingSecret: haproxy-operator-tls
  # Basic auth credentials (optional, from a Secret). When left empty and
  # vault.static.enabled=true, the deployment falls back to
  # vault.static.secretName so VSO-synced credentials are actually consumed.
  auth:
    secretName: ""
    usernameKey: username
    passwordKey: password

# SPIFFE/SPIRE integration. When enabled, mTLS credentials are obtained
# from the SPIRE Agent Workload API instead of static cert files.
# Mutually exclusive with vault.enabled — kept disabled for staging.
spire:
  enabled: false
  socketPath: "unix:///run/spire/agent.sock"

# Vault Secrets Operator (VSO) integration.
# Creates VaultPKISecret / VaultStaticSecret CRs that sync material into the
# K8s Secrets the deployment mounts.
vault:
  enabled: false
  # VaultAuth CR name (created by flux-fleet base manifests).
  authRef: vault-auth
  pki:
    mount: pki-haproxy
    role: haproxy-operator-client
    commonName: haproxy-operator.latest.ltc.bcit.ca
    ttl: 168h
    # Secret name where VSO writes the issued certificate. The rendered
    # destination keys are exactly ca.crt / tls.crt / tls.key — matching
    # dataplane.caCertPath/clientCertPath/clientKeyPath above.
    secretName: haproxy-operator-tls
  static:
    # Dataplane API basic-auth credentials in Vault KV (separate from TLS).
    enabled: false
    mount: tlu-infrastructure
    path: haproxy/latest/dataplane-basic-auth
    secretName: haproxy-operator-dataplane-auth

# Namespace-scoped RBAC is preferred: the operator only needs Secrets and
# Events in its own namespace plus leader-election leases. Set false to
# restore cluster-wide ClusterRole/ClusterRoleBinding.
rbac:
  namespaced: true

leaderElection:
  enabled: true

metrics:
  port: 9090

probes:
  port: 8081

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Zone anti-affinity for cross-datacenter HA (matches org pattern).
zoneAntiAffinity:
  enabled: false
  topologyKey: topology.kubernetes.io/zone

nodeSelector: {}
tolerations: []
