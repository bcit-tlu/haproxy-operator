# Default values for haproxy-operator.

replicaCount: 1

image:
  repository: ghcr.io/bcit-tlu/haproxy-operator/haproxy-operator
  pullPolicy: IfNotPresent
  tag: "" # Overridden by appVersion

serviceAccount:
  create: true
  name: haproxy-operator

# Namespace the operator watches for the haproxy-config Secret.
watchNamespace: haproxy-operator

# Name of the K8s Secret containing haproxy.cfg (synced by Flux).
secretName: haproxy-config
secretKey: haproxy.cfg

# HAProxy Dataplane API connection.
dataplane:
  url: "https://haproxy:5555/v3"
  insecure: false
  # Paths inside the pod where static TLS certs are mounted (used when SPIRE is disabled).
  caCertPath: /etc/haproxy-operator/tls/ca.crt
  clientCertPath: /etc/haproxy-operator/tls/tls.crt
  clientKeyPath: /etc/haproxy-operator/tls/tls.key
  # Basic auth credentials (optional, from a Secret).
  auth:
    secretName: ""
    usernameKey: username
    passwordKey: password

# SPIFFE/SPIRE integration. When enabled, mTLS credentials are obtained
# from the SPIRE Agent Workload API instead of static cert files.
spire:
  enabled: false
  socketPath: "unix:///run/spire/agent.sock"


leaderElection:
  enabled: true

metrics:
  port: 9090

probes:
  port: 8081

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Zone anti-affinity for cross-datacenter HA (matches org pattern).
zoneAntiAffinity:
  enabled: false
  topologyKey: topology.kubernetes.io/zone

nodeSelector: {}
tolerations: []
